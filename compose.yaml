name: penggemian-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: penggemian
      POSTGRES_USER: penggemian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penggemian -d penggemian"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - penggemian_pg_data:/var/lib/postgresql/data

volumes:
  penggemian_pg_data:
